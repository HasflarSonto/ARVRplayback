<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Task Timeline Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 11px;
            font-weight: 600;
            color: #cccccc;
        }

        .header button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 9px;
        }

        .header button:hover {
            background: #1177bb;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Panel - Properties Editor */
        .properties-panel {
            width: 120px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .properties-panel h2 {
            font-size: 10px;
            font-weight: 600;
            padding: 6px 8px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
        }

        .properties-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .property-group {
            margin-bottom: 8px;
        }

        .property-group label {
            display: block;
            font-size: 9px;
            color: #cccccc;
            margin-bottom: 3px;
        }

        .property-group input,
        .property-group select,
        .property-group textarea {
            width: 100%;
            padding: 3px 4px;
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            border-radius: 2px;
            color: #d4d4d4;
            font-size: 9px;
        }

        .property-group input:focus,
        .property-group select:focus,
        .property-group textarea:focus {
            outline: 1px solid #0e639c;
            border-color: #0e639c;
        }

        .property-group .vector-input {
            display: flex;
            gap: 4px;
        }

        .property-group .vector-input input {
            flex: 1;
        }

        .no-selection {
            text-align: center;
            color: #858585;
            padding: 20px 10px;
            font-size: 9px;
        }

        /* Center Panel - Timeline Editor */
        .timeline-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            overflow: hidden;
        }

        .timeline-controls {
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-controls button {
            background: #3c3c3c;
            color: #cccccc;
            border: 1px solid #3e3e42;
            padding: 2px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 9px;
        }

        .timeline-controls button:hover {
            background: #454545;
        }

        .timeline-controls button.active {
            background: #0e639c;
            color: white;
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #cccccc;
            margin-left: auto;
        }

        .timeline-container {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .timeline-ruler {
            height: 20px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            position: relative;
            overflow: hidden;
        }

        .timeline-tracks {
            position: relative;
            min-height: 200px;
        }

        .timeline-track {
            height: 28px;
            border-bottom: 1px solid #2d2d30;
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 100px;
        }

        .track-label {
            position: absolute;
            left: 0;
            width: 100px;
            padding: 0 6px;
            font-size: 9px;
            color: #858585;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #252526;
            height: 100%;
            border-right: 1px solid #3e3e42;
            z-index: 5;
        }

        .action-block {
            position: absolute;
            height: 22px;
            border-radius: 3px;
            cursor: move;
            display: flex;
            align-items: center;
            padding: 0 4px;
            font-size: 9px;
            font-weight: 500;
            border: 1px solid transparent;
            user-select: none;
            touch-action: none; /* Improves pointer event handling for VR/touch */
        }

        .action-block:hover {
            border-color: #0e639c;
        }

        .action-block.selected {
            border-color: #007acc;
            box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.3);
        }

        /* Exact time indicator for PickUp/PutDown (point events) */
        .action-block.pickup::after,
        .action-block.putdown::after {
            content: '';
            position: absolute;
            left: 50%;
            top: -2px;
            bottom: -2px;
            width: 2px;
            background: #f48771;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }

        /* Resize handles for Move blocks (duration events) */
        .action-block.move {
            cursor: default;
        }

        .resize-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            cursor: ew-resize;
            z-index: 20;
            background: transparent;
            touch-action: none; /* Improves pointer event handling for VR/touch */
        }

        .resize-handle.left {
            left: 0;
        }

        .resize-handle.right {
            right: 0;
        }

        .resize-handle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .resize-handle::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 20px;
            background: #ffffff;
            border-radius: 1px;
        }

        .resize-handle.left::before {
            left: 2px;
        }

        .resize-handle.right::before {
            right: 2px;
        }

        .action-block.pickup {
            background: #4ec9b0;
            color: #1e1e1e;
        }

        .action-block.putdown {
            background: #ce9178;
            color: #1e1e1e;
        }

        .action-block.move {
            background: #569cd6;
            color: #1e1e1e;
        }

        .action-block.placeexact {
            background: #c586c0;
            color: #1e1e1e;
        }

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #f48771;
            pointer-events: none;
            z-index: 100;
        }

        .playhead::before {
            content: '';
            position: absolute;
            top: 0;
            left: -4px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #f48771;
        }

        /* Right Panel - JSON Output */
        .json-panel {
            width: 180px;
            background: #252526;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .json-panel h2 {
            font-size: 10px;
            font-weight: 600;
            padding: 6px 8px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .json-panel button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 2px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
        }

        .json-panel button:hover {
            background: #1177bb;
        }

        .json-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 9px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
        }

        .json-action-block {
            background: #2d2d30;
            border-left: 3px solid #0e639c;
            margin-bottom: 4px;
            border-radius: 2px;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            width: 100%;
            min-height: 48px;
            display: flex;
            flex-direction: column;
        }

        .action-header {
            padding: 4px 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            min-height: 48px;
            flex-shrink: 0;
        }

        .action-header:hover {
            background: #3e3e42;
        }

        .action-title {
            font-weight: 500;
            color: #cccccc;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            flex-wrap: wrap;
            max-width: 100%;
        }

        .action-icon {
            font-size: 10px;
        }

        .action-details {
            padding: 4px 6px 6px 6px;
            font-size: 8px;
            color: #858585;
            border-top: 1px solid #3e3e42;
            max-height: 0;
            overflow: hidden;
            background: #252526;
            width: 100%;
            box-sizing: border-box;
            transition: max-height 0.2s ease-out;
        }

        .action-details.expanded {
            max-height: 500px;
            overflow: auto;
        }

        .action-expand-icon {
            font-size: 8px;
            color: #858585;
            transition: transform 0.2s;
        }

        .json-action-block.expanded .action-expand-icon {
            transform: rotate(90deg);
        }

        .action-detail-row {
            padding: 3px 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            line-height: 1.6;
        }

        .action-detail-label {
            color: #9cdcfe;
            margin-right: 4px;
        }

        .json-node {
            margin-left: 16px;
        }

        .json-key {
            color: #9cdcfe;
        }

        .json-string {
            color: #ce9178;
        }

        .json-number {
            color: #b5cea8;
        }

        .json-boolean {
            color: #569cd6;
        }

        .json-toggle {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            width: 12px;
            margin-right: 4px;
        }

        .json-toggle::before {
            content: '▶';
            color: #858585;
            font-size: 10px;
        }

        .json-toggle.collapsed::before {
            content: '▼';
        }

        .json-children {
            margin-left: 16px;
        }

        .json-children.collapsed {
            display: none;
        }

        /* Debug Panel */
        .debug-panel {
            position: fixed;
            top: 50px;
            right: 20px;
            width: 500px;
            max-height: 80vh;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(14, 99, 156, 0.5);
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        .debug-panel.visible {
            display: flex;
        }

        .debug-header {
            background: rgba(14, 99, 156, 0.8);
            color: white;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .debug-close {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .debug-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .debug-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.4;
        }

        .debug-messages {
            display: flex;
            flex-direction: column;
        }

        .debug-message {
            padding: 6px 8px;
            margin-bottom: 2px;
            background: rgba(37, 37, 38, 0.6);
            border-left: 2px solid #0e639c;
            border-radius: 2px;
            font-size: 9px;
            color: #d4d4d4;
        }

        .debug-message.error {
            border-left-color: #f48771;
            color: #f48771;
        }

        .action-type-selector {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .action-type-selector button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>VR Task Timeline Editor</h1>
        <button id="loadTaskBtn">Load Task JSON</button>
        <button id="loadRecordingBtn">Load Recording Data</button>
        <button id="exportBtn">Export JSON</button>
        <button id="debugBtn" style="background: #e74c3c;">Debug</button>
        <span id="taskName" style="margin-left: 20px; color: #858585; font-size: 12px;">No task loaded</span>
        <span id="debugInfo" style="margin-left: 20px; color: #f48771; font-size: 10px; font-family: monospace;"></span>
    </div>

    <div class="main-container">
        <!-- Left Panel - Properties Editor -->
        <div class="properties-panel">
            <h2>Properties</h2>
            <div class="properties-content" id="propertiesContent">
                <div class="no-selection">Select an action on the timeline to edit properties</div>
            </div>
        </div>

        <!-- Center Panel - Timeline Editor -->
        <div class="timeline-panel">
            <div class="timeline-controls">
                <button id="playPauseBtn">▶ Play</button>
                <button id="stopBtn">⏹ Stop</button>
                <button id="zoomInBtn">+</button>
                <button id="zoomOutBtn">-</button>
                <div class="time-display">
                    <span id="currentTime">0.00</span> / <span id="totalTime">0.00</span>s
                </div>
            </div>
            <div class="timeline-container">
                <div class="timeline-ruler" id="timelineRuler"></div>
                <div class="timeline-tracks" id="timelineTracks"></div>
                <div class="playhead" id="playhead"></div>
            </div>
        </div>

        <!-- Right Panel - JSON Output -->
        <div class="json-panel">
            <h2>
                <span>Output JSON</span>
                <button id="copyJsonBtn">Copy</button>
            </h2>
            <div class="json-content" id="jsonContent">
                <div style="color: #858585;">Load a task to see JSON output</div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel">
        <div class="debug-header">
            <span>Debug Console</span>
            <button class="debug-close" id="debugCloseBtn">✕</button>
        </div>
        <div class="debug-content" id="debugContent">
            <div class="debug-messages" id="debugMessages"></div>
        </div>
    </div>

    <script>
        // Global state
        let taskData = null;
        let recordingData = null;
        let selectedStep = null;
        let isPlaying = false;
        let currentTime = 0;
        let playInterval = null;
        let pixelsPerSecond = 50; // Timeline zoom level
        let timelineOffset = 0;
        let moveBlocksGenerated = false; // Track if Move blocks have been auto-generated

        // Debug tracking
        let messageHistory = [];
        let unityMessagesReceived = 0;
        let lastUnityMessageTime = null;

        // Update status bar
        function updateStatus(message, type = 'info') {
            const statusBar = document.getElementById('statusBar');
            if (!statusBar) return;

            statusBar.textContent = message;
            statusBar.className = 'status-bar';

            if (type === 'waiting') {
                statusBar.classList.add('waiting');
            } else if (type === 'error') {
                statusBar.classList.add('error');
            } else if (type === 'success') {
                statusBar.classList.add('success');
            }

            console.log(`[STATUS] ${message}`);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            setupUnityMessageListener();

            updateStatus('🟢 PAGE READY - Waiting for Unity recording data...', 'waiting');

            // Debug: Log current location
            logDebugMessage('Page Loaded', `Protocol: ${window.location.protocol}, Hostname: ${window.location.hostname || '(empty)'}`);
            logDebugMessage('URL', `Full href: ${window.location.href}`);

            // IMPORTANT: We are EXCLUSIVELY using Unity data now.
            // NO sample data loading - all data comes from Unity after recording.
            logDebugMessage('Mode', 'Unity-only mode - waiting for data from Unity recording');

            // Check for Vuplex API - it loads after page finishes loading
            // Listen for vuplexready event to know when window.vuplex is available
            if (typeof window.vuplex !== 'undefined') {
                logDebugMessage('Vuplex API', 'window.vuplex already available');
                setupLegacyVuplexListener();
            } else {
                logDebugMessage('Vuplex API', 'Waiting for vuplexready event...');
                window.addEventListener('vuplexready', () => {
                    logDebugMessage('Vuplex API', 'vuplexready event fired - window.vuplex now available');
                    setupLegacyVuplexListener();
                });
            }
        });

        // Setup legacy listener for older Vuplex versions (pre-4.11)
        function setupLegacyVuplexListener() {
            if (window.vuplex && window.vuplex.addEventListener) {
                logDebugMessage('Legacy Listener', 'Setting up window.vuplex.addEventListener for pre-4.11 compatibility');
                window.vuplex.addEventListener('message', (event) => {
                    logDebugMessage('Legacy Message', 'Received via window.vuplex.addEventListener (pre-4.11)');
                    // Process the same way as vuplexmessage
                    processVuplexMessage(event.value || event);
                });
            }
        }

        // Process Vuplex message (shared by both modern and legacy listeners)
        function processVuplexMessage(rawValue) {
            try {
                updateStatus('📨 RECEIVED MESSAGE FROM UNITY! Processing...', 'info');

                // Log raw data for debugging
                console.log('------RECEIVED MESSAGE START------');
                console.log('Type:', typeof rawValue);
                console.log('Length:', (typeof rawValue === 'string' ? rawValue.length : 'N/A'));
                console.log('FULL RAW VALUE:');
                console.log(rawValue);
                console.log('------RECEIVED MESSAGE END------');

                if (typeof rawValue === 'string') {
                    logDebugMessage('Raw Value String', `Length: ${rawValue.length}, Preview: ${rawValue.substring(0, 150)}`);
                } else {
                    logDebugMessage('Raw Value Object', `Type: ${typeof rawValue}, Keys: ${Object.keys(rawValue || {}).join(', ')}`);
                }

                // Parse the message (Unity sends it as a JSON string)
                let message;
                if (typeof rawValue === 'string') {
                    try {
                        message = JSON.parse(rawValue);
                        console.log('------PARSED MESSAGE START------');
                        console.log('Message type:', message.type);
                        console.log('Message keys:', Object.keys(message).join(', '));
                        console.log('Full parsed message:');
                        console.log(JSON.stringify(message, null, 2));
                        console.log('------PARSED MESSAGE END------');
                        logDebugMessage('Parse Success', `Parsed message type: ${message.type || 'unknown'}`);
                        updateStatus(`📦 Message type: ${message.type} - ${rawValue.length} chars`, 'info');
                    } catch (e) {
                        console.warn('Failed to parse message as JSON:', e);
                        logDebugMessage('Parse Error', `Failed to parse: ${e.message}. Value: ${rawValue.substring(0, 100)}`, true);
                        updateStatus(`❌ PARSE ERROR: ${e.message}`, 'error');
                        message = rawValue;
                    }
                } else {
                    message = rawValue;
                    logDebugMessage('Direct Object', `Received direct object with type: ${message.type || 'unknown'}`);
                    updateStatus(`📦 Direct object received, type: ${message.type || 'unknown'}`, 'info');
                }

                // Track Unity messages
                if (message && message.type) {
                    unityMessagesReceived++;
                    lastUnityMessageTime = new Date().toLocaleTimeString();

                    // Log non-spam messages
                    if (message.type !== 'updateTime' && message.type !== 'sliderValue') {
                        logDebugMessage(`Unity Message`, `Type: ${message.type}, Fields: ${Object.keys(message).join(', ')}`);
                    }
                }

                // Filter out slider/updateTime spam from console
                if (message && message.type !== 'updateTime' && message.type !== 'sliderValue') {
                    console.log('════════════════════════════════════════════════');
                    console.log('📨 RECEIVED MESSAGE FROM UNITY:');
                    console.log('Message type:', message.type);
                    console.log('Full message object:');
                    console.log(JSON.stringify(message, null, 2));
                    console.log('════════════════════════════════════════════════');
                }

                if (message && message.type === 'loadTimelineData') {
                    logDebugMessage('loadTimelineData', 'Processing loadTimelineData message...');
                    console.log('════════════════════════════════════════════════');
                    console.log('FULL MESSAGE RECEIVED:');
                    console.log(JSON.stringify(message, null, 2));
                    console.log('════════════════════════════════════════════════');

                    // Load task data - handle both object (taskData) and string (taskJSON) formats
                    if (message.taskData) {
                        // Unity sends taskData as an object (not a string)
                        console.log('Found taskData field (object)');
                        try {
                            taskData = message.taskData; // Already an object, no parsing needed
                            console.log('Task data set:', taskData);
                            console.log('Steps:', taskData.steps);
                            if (taskData.steps && taskData.steps.length > 0) {
                                console.log('First step:', taskData.steps[0]);
                            }
                            logDebugMessage('Task Data Success', `Loaded task with ${taskData.steps ? taskData.steps.length : 0} steps`);
                            loadTask();
                        } catch (e) {
                            console.error('Error loading task data from Unity:', e);
                            logDebugMessage('Task Load ERROR', `${e.message}`, true);
                        }
                    } else if (message.taskJSON) {
                        // Fallback: handle taskJSON string format
                        console.log('------FOUND TASKJSON FIELD------');
                        console.log('taskJSON type:', typeof message.taskJSON);
                        console.log('taskJSON length:', message.taskJSON ? message.taskJSON.length : 0);
                        console.log('taskJSON is empty string?', message.taskJSON === '');

                        if (!message.taskJSON || message.taskJSON === '') {
                            console.error('------TASKJSON IS EMPTY!------');
                            logDebugMessage('Empty taskJSON', 'taskJSON field exists but is empty!', true);
                        } else {
                            try {
                                taskData = JSON.parse(message.taskJSON);
                                console.log('------PARSED TASKJSON SUCCESSFULLY------');
                                console.log('Full parsed task data:');
                                console.log(JSON.stringify(taskData, null, 2));

                                if (taskData.steps && taskData.steps.length > 0) {
                                    console.log('First step structure:');
                                    console.log(JSON.stringify(taskData.steps[0], null, 2));
                                }

                                logDebugMessage('Task Parse Success', `Parsed task with ${taskData.steps ? taskData.steps.length : 0} steps`);
                                loadTask();
                            } catch (e) {
                                console.error('------ERROR PARSING TASKJSON------');
                                console.error('Parse error:', e);
                                console.error('taskJSON content (first 500 chars):', message.taskJSON.substring(0, 500));
                                logDebugMessage('Task Parse ERROR', `${e.message}`, true);
                            }
                        }
                    } else {
                        console.log('------NO TASKJSON OR TASKDATA FIELD------');
                        logDebugMessage('No taskData', 'loadTimelineData message has no taskData or taskJSON field!', true);
                        updateStatus('❌ ERROR: No taskJSON or taskData in message!', 'error');
                    }

                    // Load recording data - handle both object (recordingData) and string (recordingJSON) formats
                    if (message.recordingData) {
                        // Unity sends recordingData as an object (not a string)
                        logDebugMessage('recordingData Field', `Found recordingData object, type: ${typeof message.recordingData}`);
                        try {
                            recordingData = message.recordingData; // Already an object, no parsing needed
                            console.log('Recording data loaded from Unity:', recordingData);
                            logDebugMessage('Recording Loaded', `${recordingData.interactionEvents ? recordingData.interactionEvents.length : 0} interaction events`);
                        } catch (e) {
                            console.error('Error loading recording data from Unity:', e);
                            logDebugMessage('Recording Load ERROR', `${e.message}`, true);
                        }
                    } else if (message.recordingJSON) {
                        // Fallback: handle recordingJSON string format
                        logDebugMessage('recordingJSON Field', `Found recordingJSON string, length: ${message.recordingJSON.length || 'N/A'}`);
                        try {
                            recordingData = JSON.parse(message.recordingJSON);
                            console.log('Recording data loaded from Unity:', recordingData);
                            logDebugMessage('Recording Loaded', `${recordingData.interactionEvents ? recordingData.interactionEvents.length : 0} interaction events`);
                        } catch (e) {
                            console.error('Error parsing recording JSON from Unity:', e, message.recordingJSON);
                            logDebugMessage('Recording Parse ERROR', `${e.message}`, true);
                        }
                    } else {
                        logDebugMessage('No recordingData', 'loadTimelineData message has no recordingData or recordingJSON field (optional)');
                    }
                } else if (message && message.type === 'displayJSON') {
                    // Legacy support for old index.html format
                    if (message.json) {
                        try {
                            taskData = JSON.parse(message.json);
                            loadTask();
                            console.log('Task data loaded from Unity (legacy):', taskData);
                        } catch (e) {
                            console.error('Error parsing JSON from Unity:', e);
                        }
                    }
                } else if (message && message.type === 'statusUpdate') {
                    // Unity sent us a status update
                    if (message.message) {
                        updateStatus(message.message, 'info');
                        logDebugMessage('Unity Status', message.message);
                    }
                } else if (message && message.type === 'updateTime') {
                    // Update playhead position
                    if (typeof message.time === 'number') {
                        currentTime = message.time;
                        updatePlayhead();
                    }
                } else if (message && message.type === 'sliderValue') {
                    // Unity slider sends currentTime in SECONDS - use it directly
                    if (typeof message.currentTime === 'number') {
                        currentTime = message.currentTime;

                        // CRITICAL DEBUG: Display debug info on screen
                        const webViewDuration = taskData?.totalDuration || 0;
                        const unityDuration = message.totalDuration || 0;
                        const normalizedValue = message.value || 0;
                        const durMatch = Math.abs(webViewDuration - unityDuration) < 0.01;

                        // Show debug info on screen
                        const debugInfo = document.getElementById('debugInfo');
                        if (debugInfo) {
                            debugInfo.textContent = `Time:${message.currentTime.toFixed(2)}s | Norm:${normalizedValue.toFixed(3)} | WebDur:${webViewDuration.toFixed(2)}s | UnityDur:${unityDuration.toFixed(2)}s | ${durMatch ? '✓ MATCH' : '✗ MISMATCH'}`;
                        }

                        updatePlayhead();

                        // Update time display
                        const timeDisplay = document.getElementById('currentTime');
                        if (timeDisplay) {
                            timeDisplay.textContent = currentTime.toFixed(2);
                        }
                    }
                }
            } catch (error) {
                console.error('Error processing message:', error);
                logDebugMessage('Processing Error', `${error.message}`, true);
            }
        }

        function updateDebugPanel() {
            const debugContainer = document.getElementById('debugMessages');
            if (!debugContainer) return;

            if (messageHistory.length === 0) {
                debugContainer.innerHTML = '<div style="color: #858585; padding: 8px;">No logs yet</div>';

            }

            // Show all messages, newest first

            recentMessages.forEach(msg => {

        function logDebugMessage(type, message, isError = false) {
            messageHistory.push({
                time: new Date().toLocaleTimeString(),
                type: type,
                message: message,
                isError: isError
            });

            // Keep ALL messages (no limit for debugging)
            // Will clear when page reloads

        function handleFileLoad(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (e.target.dataset.type === 'task') {
                        taskData = data;
                        loadTask();
                    } else {
                        recordingData = data;
                        console.log('Recording data loaded:', data);
                    }
                } catch (error) {
                    alert('Error parsing JSON: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // Sample data loading REMOVED - we exclusively use Unity data now
        // Data is sent from Unity via WebViewManager.DisplayJSON() after recording finishes

        function loadTask() {
            console.log('════════════════════════════════════════════════');
            console.log('🚀 loadTask() CALLED');
            logDebugMessage('loadTask()', 'Function called');

            if (!taskData) {
                console.log('❌ taskData is NULL in loadTask()');
                logDebugMessage('loadTask() ABORT', 'taskData is null or undefined!', true);

            }

            console.log(JSON.stringify(taskData, null, 2));
            console.log('════════════════════════════════════════════════');

            // FIXED zoom algorithm: Use consistent pixels-per-second regardless of duration
            // This ensures the scale is always the same, making sync with Unity slider work correctly
            const duration = taskData.totalDuration;

            // Use a FIXED zoom level that's reasonable for viewing
            // 50 px/s means: 1 second = 50 pixels
            // For a 10s recording: 500px width
            // For a 20s recording: 1000px width
            pixelsPerSecond = 50;

            const timelineWidth = duration * pixelsPerSecond;

            console.log(`📏 Timeline Setup: duration=${duration.toFixed(3)}s, zoom=${pixelsPerSecond}px/s, width=${timelineWidth.toFixed(0)}px`);

                const eventTime = step.action === 'Move' ? (step.endTime || step.timestamp) : step.timestamp;
                if (eventTime > maxEventTime) maxEventTime = eventTime;
            });
            console.log(`📊 Max event timestamp: ${maxEventTime.toFixed(3)}s (duration: ${duration.toFixed(3)}s, diff: ${(duration - maxEventTime).toFixed(3)}s)`);
            logDebugMessage('Auto-Zoom', `Fixed zoom: ${pixelsPerSecond}px/s → ${timelineWidth.toFixed(0)}px timeline for ${duration.toFixed(3)}s`);

                        updateJSONOutput();

                renderTimeline();
                logDebugMessage('loadTask() Timeline', 'renderTimeline() completed');

                // updateJSONOutput will be called after 2 second delay (see above)
                logDebugMessage('loadTask() JSON', 'updateJSONOutput() will be called after test');
