        function renderTimeline() {
            logDebugMessage('renderTimeline()', 'Function called');

            if (!taskData) {
                logDebugMessage('renderTimeline() ABORT', 'taskData is null!', true);
                return;
            }

            logDebugMessage('renderTimeline() Start', `Rendering ${taskData.steps?.length || 0} steps`);

            const ruler = document.getElementById('timelineRuler');
            const tracks = document.getElementById('timelineTracks');

            if (!ruler || !tracks) {
                logDebugMessage('renderTimeline() ERROR', 'Timeline DOM elements not found!', true);
                return;
            }

            // Clear existing
            ruler.innerHTML = '';
            tracks.innerHTML = '';
            logDebugMessage('renderTimeline() Clear', 'Cleared existing timeline content');

            const duration = taskData.totalDuration;
            const rulerWidth = duration * pixelsPerSecond;
            ruler.style.width = rulerWidth + 'px';
            ruler.style.paddingLeft = '100px'; // Start after track labels

            // Draw ruler (offset by track label width)
            const labelWidth = 100;
            for (let i = 0; i <= duration; i += 1) {
                const marker = document.createElement('div');
                marker.style.position = 'absolute';
                marker.style.left = (labelWidth + i * pixelsPerSecond) + 'px';
                marker.style.top = '0';
                marker.style.height = '100%';
                marker.style.width = '1px';
                marker.style.background = i % 5 === 0 ? '#858585' : '#3e3e42';
                ruler.appendChild(marker);

                // Show label for every second
                const label = document.createElement('div');
                label.textContent = i + 's';
                label.style.position = 'absolute';
                label.style.left = (labelWidth + i * pixelsPerSecond + 4) + 'px';
                label.style.top = '4px';
                label.style.fontSize = '11px';
                label.style.color = i % 5 === 0 ? '#858585' : '#606060';
                ruler.appendChild(label);
            }

            // Group steps by object and sort by timestamp
            const stepsByObject = {};
            taskData.steps.forEach(step => {
                if (!stepsByObject[step.objectId]) {
                    stepsByObject[step.objectId] = [];
                }
                stepsByObject[step.objectId].push(step);
            });

            logDebugMessage('renderTimeline() Group', `Grouped into ${Object.keys(stepsByObject).length} objects`);

            // Sort steps within each object by timestamp (use startTime for Move)
            Object.keys(stepsByObject).forEach(objectId => {
                stepsByObject[objectId].sort((a, b) => {
                    const timeA = a.action === 'Move' ? (a.startTime || a.timestamp) : a.timestamp;
                    const timeB = b.action === 'Move' ? (b.startTime || b.timestamp) : b.timestamp;
                    return timeA - timeB;
                });
            });
            
            // Don't auto-generate Move blocks - user must add them manually
            // Move blocks are only created when user clicks "Move" in the action selector

            // Rebuild taskData.steps from grouped steps (to include Move actions)
            taskData.steps = [];
            Object.keys(stepsByObject).forEach(objectId => {
                stepsByObject[objectId].forEach(step => {
                    taskData.steps.push(step);
                });
            });
            // Sort all steps by timestamp (use startTime for Move) and renumber
            taskData.steps.sort((a, b) => {
                const timeA = a.action === 'Move' ? (a.startTime || a.timestamp) : a.timestamp;
                const timeB = b.action === 'Move' ? (b.startTime || b.timestamp) : b.timestamp;
                return timeA - timeB;
            });
            taskData.steps.forEach((step, idx) => {
                step.stepNumber = idx + 1;
            });
            
            // Create tracks
            let trackIndex = 0;
            let totalBlocks = 0;
            Object.keys(stepsByObject).forEach(objectId => {
                const steps = stepsByObject[objectId];
                const firstStep = steps[0];
                const track = createTrack(firstStep.objectName || objectId, trackIndex++, objectId);
                tracks.appendChild(track);

                steps.forEach(step => {
                    const block = createActionBlock(step);
                    track.appendChild(block);
                    totalBlocks++;
                });
            });

            logDebugMessage('renderTimeline() Tracks', `Created ${trackIndex} tracks with ${totalBlocks} action blocks`);

            updateJSONOutput();

            updatePlayhead();

            logDebugMessage('renderTimeline() SUCCESS', 'Timeline rendering complete!');
        }

        function createTrack(label, index, objectId) {
            const track = document.createElement('div');
            track.className = 'timeline-track';
            track.style.top = (index * 40) + 'px';
            track.dataset.objectId = objectId;

            const labelDiv = document.createElement('div');
            labelDiv.className = 'track-label';
            labelDiv.textContent = label;
            track.appendChild(labelDiv);

            // Make track clickable to add new actions
            track.addEventListener('click', (e) => {
                // Don't trigger if clicking on a block or label
                if (e.target.classList.contains('action-block') || 
                    e.target.classList.contains('track-label') ||
                    e.target.closest('.action-block')) {
                    return;
                }
                
                // Calculate timestamp from click position
                const trackRect = track.getBoundingClientRect();
                const clickX = e.clientX - trackRect.left - 100; // Subtract label width
                const timestamp = Math.max(0, clickX / pixelsPerSecond);
                
                // Show action type selector
                showActionTypeSelector(track, timestamp, objectId, label);
            });

            return track;
        }

        function showActionTypeSelector(track, timestamp, objectId, objectName) {
            // Remove existing selector if any
            const existing = document.querySelector('.action-type-selector');
            if (existing) existing.remove();

            const selector = document.createElement('div');
            selector.className = 'action-type-selector';
            selector.style.position = 'absolute';
            const labelWidth = 100;
            selector.style.left = (labelWidth + timestamp * pixelsPerSecond - 40) + 'px';
            selector.style.top = '4px';
            selector.style.background = '#2d2d30';
            selector.style.border = '1px solid #3e3e42';
            selector.style.borderRadius = '4px';
            selector.style.padding = '8px';
            selector.style.zIndex = '1000';
            selector.style.display = 'flex';
            selector.style.gap = '4px';

            // Store removeSelector function so we can clean it up
            let removeSelector = null;

            const actions = ['PickUp', 'Move', 'PutDown'];
            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.textContent = action;
                btn.style.padding = '4px 8px';
                // Set colors based on action type
                let bgColor = '#ce9178'; // Default (PutDown)
                if (action === 'PickUp') bgColor = '#e74c3c';
                else if (action === 'Move') bgColor = '#569cd6';
                btn.style.background = bgColor;
                btn.style.color = '#1e1e1e';
                btn.style.border = 'none';
                btn.style.borderRadius = '3px';
                btn.style.cursor = 'pointer';
                btn.style.fontSize = '11px';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent event from bubbling
                    createNewAction(track, action, timestamp, objectId, objectName);
                    selector.remove();
                    // Clean up the click-outside listener
                    if (removeSelector) {
                        document.removeEventListener('click', removeSelector);
                    }
                });
                selector.appendChild(btn);
            });

            track.appendChild(selector);

            // Remove selector if clicking outside
            setTimeout(() => {
                removeSelector = (e) => {
                    if (!selector.contains(e.target) && !track.contains(e.target)) {
                        selector.remove();
                        document.removeEventListener('click', removeSelector);
                    }
                };
                setTimeout(() => document.addEventListener('click', removeSelector), 100);
            }, 0);
        }

        function createNewAction(track, action, timestamp, objectId, objectName) {
            // Find the highest step number
            let maxStepNumber = 0;
            if (taskData && taskData.steps) {
                taskData.steps.forEach(step => {
                    if (step.stepNumber > maxStepNumber) {
                        maxStepNumber = step.stepNumber;
                    }
                });
            }

            const newStep = {
                stepNumber: maxStepNumber + 1,
                action: action,
                objectId: objectId,
                objectName: objectName,
                timestamp: timestamp
            };

            // Add position/rotation for PutDown
            if (action === 'PutDown') {
                newStep.position = { x: 0, y: 0, z: 0 };
                newStep.rotation = { x: 0, y: 0, z: 0, w: 1 };
                newStep.tolerance = { distance: 0.1, rotation: 15.0 };
            }
            
            // Add startTime/endTime for Move (duration event)
            if (action === 'Move') {
                newStep.startTime = timestamp;
                newStep.endTime = timestamp + 1.0; // Default 1 second duration
            }

            // Add to task data
            if (!taskData.steps) taskData.steps = [];
            taskData.steps.push(newStep);
            
            // Sort and renumber (use startTime for Move)
            taskData.steps.sort((a, b) => {
                const timeA = a.action === 'Move' ? (a.startTime || a.timestamp) : a.timestamp;
                const timeB = b.action === 'Move' ? (b.startTime || b.timestamp) : b.timestamp;
                return timeA - timeB;
            });
            taskData.steps.forEach((step, idx) => {
                step.stepNumber = idx + 1;
            });

            // Create and add block
            const block = createActionBlock(newStep);
            track.appendChild(block);
            
            // Select the new action
            selectStep(newStep);
            
            updateJSONOutput();
        }

        function createActionBlock(step) {
            const block = document.createElement('div');
            block.className = `action-block ${step.action.toLowerCase()}`;
            // Just show action name - row label already shows object name
            block.textContent = step.action;
            block.dataset.stepNumber = step.stepNumber;
            block.dataset.objectId = step.objectId;
            block.dataset.action = step.action;

            const labelWidth = 100;

            // EXACT same formula as playhead - NO offset!
            // position = labelWidth + (timestamp × pixelsPerSecond)
            const left = labelWidth + (step.timestamp * pixelsPerSecond);

            // Debug: Show first event position on screen
            if ((step.action === 'PickUp' || step.action === 'PutDown') && step.stepNumber === 1) {
                const debugInfo = document.getElementById('debugInfo');
                if (debugInfo) {
                    debugInfo.textContent = `First ${step.action}: ${step.timestamp.toFixed(2)}s × ${pixelsPerSecond}px/s = ${left.toFixed(0)}px`;
                }
                console.log(`📍 FIRST ${step.action}: time=${step.timestamp.toFixed(3)}s, zoom=${pixelsPerSecond}px/s, pos=${left.toFixed(1)}px`);
            }

            // PickUp and PutDown are point events - place at EXACT timestamp position (same as playhead)
            if (step.action === 'PickUp' || step.action === 'PutDown') {
                block.style.left = left + 'px'; // NO offset - exact timestamp position
                block.style.width = '60px';
                block.style.justifyContent = 'center';
            } 
            // Move is a duration event - needs start and end times
            else if (step.action === 'Move') {
                // Move blocks need startTime and endTime
                if (!step.startTime) step.startTime = step.timestamp;
                if (!step.endTime) step.endTime = step.timestamp + 1.0; // Default 1 second duration

                // Direct formula: position = labelWidth + (time × zoom)
                const startLeft = labelWidth + (step.startTime * pixelsPerSecond);
                const width = (step.endTime - step.startTime) * pixelsPerSecond;

                block.style.left = startLeft + 'px';
                block.style.width = Math.max(20, width) + 'px';
                
                // Add resize handles
                const leftHandle = document.createElement('div');
                leftHandle.className = 'resize-handle left';
                // Add both mouse and pointer event listeners for VR compatibility
                leftHandle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    startResize(block, step, 'left', e);
                });
                leftHandle.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    startResize(block, step, 'left', e);
                });
                block.appendChild(leftHandle);

                const rightHandle = document.createElement('div');
                rightHandle.className = 'resize-handle right';
                // Add both mouse and pointer event listeners for VR compatibility
                rightHandle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    startResize(block, step, 'right', e);
                });
                rightHandle.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    startResize(block, step, 'right', e);
                });
                block.appendChild(rightHandle);
            }
            // Other actions
            else {
                const widths = {
                    'PlaceExact': 60
                };
                const width = widths[step.action] || 50;
                block.style.left = left + 'px';
                block.style.width = width + 'px';
            }

            block.addEventListener('click', (e) => {
                // Don't select if clicking on resize handle
                if (!e.target.classList.contains('resize-handle') && 
                    !e.target.closest('.resize-handle')) {
                    e.stopPropagation();
                    selectStep(step);
                }
            });

            // Make draggable (but not for Move - it uses resize handles)
            if (step.action !== 'Move') {
                makeDraggable(block, step);
            } else {
                // For Move, allow dragging the whole block (which moves both start and end)
                makeMoveBlockDraggable(block, step);
            }

            return block;
        }

        function makeDraggable(block, step) {
            let isDragging = false;
            let startX = 0;
            let startLeft = 0;

            // Handler for starting drag (works for both mouse and pointer events)
            const onDragStart = (e) => {
                // Don't drag if clicking on resize handle
                if (e.target.classList.contains('resize-handle')) return;

                isDragging = true;
                startX = e.clientX;
                startLeft = parseFloat(block.style.left);
                block.style.cursor = 'grabbing';
                e.preventDefault();
            };

            // Handler for dragging (works for both mouse and pointer events)
            const onDragMove = (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - startX;
                const labelWidth = 100;
                const newLeft = Math.max(labelWidth, startLeft + deltaX);

                // Direct calculation - NO offset
                const timestamp = (newLeft - labelWidth) / pixelsPerSecond;
                step.timestamp = Math.max(0, timestamp);
                block.style.left = (labelWidth + step.timestamp * pixelsPerSecond) + 'px';

                updateJSONOutput();
                renderTimeline(); // Re-render to update playhead position
            };

            // Handler for ending drag (works for both mouse and pointer events)
            const onDragEnd = () => {
                if (isDragging) {
                    isDragging = false;
                    block.style.cursor = 'move';
                }
            };

            // Add both mouse and pointer event listeners for maximum compatibility
            // Pointer events work for: mouse, touch, stylus, AND VR controllers
            block.addEventListener('mousedown', onDragStart);
            block.addEventListener('pointerdown', onDragStart);

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('pointermove', onDragMove);

            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('pointerup', onDragEnd);
        }

        function makeMoveBlockDraggable(block, step) {
            let isDragging = false;
            let startX = 0;
            let startLeft = 0;
            let startStartTime = 0;
            let startEndTime = 0;

            // Handler for starting drag (works for both mouse and pointer events)
            const onDragStart = (e) => {
                // Don't drag if clicking on resize handle
                if (e.target.classList.contains('resize-handle')) return;

                isDragging = true;
                startX = e.clientX;
                startLeft = parseFloat(block.style.left);
                startStartTime = step.startTime;
                startEndTime = step.endTime;
                block.style.cursor = 'grabbing';
                e.preventDefault();
            };

            // Handler for dragging (works for both mouse and pointer events)
            const onDragMove = (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - startX;
                const deltaTime = deltaX / pixelsPerSecond;
                const newStartTime = Math.max(0, startStartTime + deltaTime);
                const newEndTime = Math.max(newStartTime + 0.1, startEndTime + deltaTime); // Min 0.1s duration

                step.startTime = newStartTime;
                step.endTime = newEndTime;

                const labelWidth = 100;
                const newLeft = labelWidth + newStartTime * pixelsPerSecond;
                const width = (newEndTime - newStartTime) * pixelsPerSecond;
                block.style.left = newLeft + 'px';
                block.style.width = Math.max(20, width) + 'px';

                updateJSONOutput();
            };

            // Handler for ending drag (works for both mouse and pointer events)
            const onDragEnd = () => {
                if (isDragging) {
                    isDragging = false;
                    block.style.cursor = 'default';
                }
            };

            // Add both mouse and pointer event listeners for maximum compatibility
            // Pointer events work for: mouse, touch, stylus, AND VR controllers
            block.addEventListener('mousedown', onDragStart);
            block.addEventListener('pointerdown', onDragStart);

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('pointermove', onDragMove);

            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('pointerup', onDragEnd);
        }

        function startResize(block, step, side, e) {
            e.stopPropagation();
            e.preventDefault();

            let isResizing = true;
            let startX = e.clientX;
            let startStartTime = step.startTime;
            let startEndTime = step.endTime;
            let startWidth = parseFloat(block.style.width);
            let startLeft = parseFloat(block.style.left);

            // Handler for resize move (works for both mouse and pointer events)
            function onResizeMove(e) {
                if (!isResizing) return;

                const deltaX = e.clientX - startX;
                const deltaTime = deltaX / pixelsPerSecond;

                if (side === 'left') {
                    const newStartTime = Math.max(0, startStartTime + deltaTime);
                    const newEndTime = Math.max(newStartTime + 0.1, startEndTime); // Min 0.1s duration

                    step.startTime = newStartTime;
                    step.endTime = newEndTime;

                    const labelWidth = 100;
                    const newLeft = labelWidth + newStartTime * pixelsPerSecond;
                    const width = (newEndTime - newStartTime) * pixelsPerSecond;
                    block.style.left = newLeft + 'px';
                    block.style.width = Math.max(20, width) + 'px';
                } else if (side === 'right') {
                    const newEndTime = Math.max(startStartTime + 0.1, startEndTime + deltaTime); // Min 0.1s duration

                    step.startTime = startStartTime;
                    step.endTime = newEndTime;

                    const width = (newEndTime - startStartTime) * pixelsPerSecond;
                    block.style.width = Math.max(20, width) + 'px';
                }

                updateJSONOutput();
            }

            // Handler for resize end (works for both mouse and pointer events)
            function onResizeUp() {
                isResizing = false;
                // Remove both mouse and pointer event listeners
                document.removeEventListener('mousemove', onResizeMove);
                document.removeEventListener('pointermove', onResizeMove);
                document.removeEventListener('mouseup', onResizeUp);
                document.removeEventListener('pointerup', onResizeUp);
            }

            // Add both mouse and pointer event listeners for maximum compatibility
            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('pointermove', onResizeMove);
            document.addEventListener('mouseup', onResizeUp);
            document.addEventListener('pointerup', onResizeUp);
        }

        function selectStep(step) {
            selectedStep = step;
            
            // Update UI
            document.querySelectorAll('.action-block').forEach(block => {
                block.classList.remove('selected');
            });
            
            // Find block by matching step data (more reliable than just stepNumber)
            document.querySelectorAll('.action-block').forEach(block => {
                const blockStepNumber = parseInt(block.dataset.stepNumber);
                const blockAction = block.textContent.trim();
                const blockObjectId = block.dataset.objectId;
                
                // Match by stepNumber, action, and objectId
                if (blockStepNumber === step.stepNumber && 
                    blockAction === step.action && 
                    blockObjectId === step.objectId) {
                    block.classList.add('selected');
                }
            });

            renderProperties();
        }

        function renderProperties() {
            const content = document.getElementById('propertiesContent');
            if (!selectedStep) {
                content.innerHTML = '<div class="no-selection">Select an action on the timeline to edit properties</div>';
                return;
            }

            const step = selectedStep;
            content.innerHTML = `
                <div class="property-group" style="margin-bottom: 16px;">
                    <button id="deleteBtn" style="width: 100%; background: #c41e3a; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
                        🗑️ Delete Action
                    </button>
                </div>
                <div class="property-group">
                    <label>Action Type</label>
                    <select id="propAction">
                        <option value="PickUp" ${step.action === 'PickUp' ? 'selected' : ''}>PickUp</option>
                        <option value="Move" ${step.action === 'Move' ? 'selected' : ''}>Move</option>
                        <option value="PutDown" ${step.action === 'PutDown' ? 'selected' : ''}>PutDown</option>
                        <option value="PlaceExact" ${step.action === 'PlaceExact' ? 'selected' : ''}>PlaceExact</option>
                    </select>
                </div>
                <div class="property-group">
                    <label>Object ID</label>
                    <input type="text" id="propObjectId" value="${step.objectId}">
                </div>
                <div class="property-group">
                    <label>Object Name</label>
                    <input type="text" id="propObjectName" value="${step.objectName || ''}">
                </div>
                ${step.action === 'Move' ? `
                <div class="property-group">
                    <label>Start Time (seconds)</label>
                    <input type="number" id="propStartTime" value="${step.startTime.toFixed(2)}" step="0.1">
                </div>
                <div class="property-group">
                    <label>End Time (seconds)</label>
                    <input type="number" id="propEndTime" value="${step.endTime.toFixed(2)}" step="0.1">
                </div>
                <div class="property-group">
                    <label>Duration (seconds)</label>
                    <input type="number" id="propDuration" value="${(step.endTime - step.startTime).toFixed(2)}" step="0.1" readonly style="background: #2d2d30;">
                </div>
                ` : `
                <div class="property-group">
                    <label>Timestamp (seconds)</label>
                    <input type="number" id="propTimestamp" value="${step.timestamp.toFixed(2)}" step="0.1">
                </div>
                `}
                ${step.position ? `
                <div class="property-group">
                    <label>Position</label>
                    <div class="vector-input">
                        <input type="number" id="propPosX" value="${step.position.x.toFixed(3)}" step="0.001" placeholder="X">
                        <input type="number" id="propPosY" value="${step.position.y.toFixed(3)}" step="0.001" placeholder="Y">
                        <input type="number" id="propPosZ" value="${step.position.z.toFixed(3)}" step="0.001" placeholder="Z">
                    </div>
                </div>
                <div class="property-group">
                    <label>Rotation</label>
                    <div class="vector-input">
                        <input type="number" id="propRotX" value="${step.rotation.x.toFixed(3)}" step="0.001" placeholder="X">
                        <input type="number" id="propRotY" value="${step.rotation.y.toFixed(3)}" step="0.001" placeholder="Y">
                        <input type="number" id="propRotZ" value="${step.rotation.z.toFixed(3)}" step="0.001" placeholder="Z">
                        <input type="number" id="propRotW" value="${step.rotation.w.toFixed(3)}" step="0.001" placeholder="W">
                    </div>
                </div>
                ` : ''}
            `;

            // Add delete button listener
            document.getElementById('deleteBtn').addEventListener('click', () => {
                deleteAction(step);
            });

            // Add event listeners
            document.getElementById('propAction').addEventListener('change', (e) => {
                step.action = e.target.value;
                updateJSONOutput();
                renderTimeline();
            });
            document.getElementById('propObjectId').addEventListener('change', (e) => {
                step.objectId = e.target.value;
                updateJSONOutput();
            });
            document.getElementById('propObjectName').addEventListener('change', (e) => {
                step.objectName = e.target.value;
                updateJSONOutput();
            });
            const timestampInput = document.getElementById('propTimestamp');
            if (timestampInput) {
                timestampInput.addEventListener('change', (e) => {
                    step.timestamp = parseFloat(e.target.value);
                    updateJSONOutput();
                    renderTimeline();
                });
            }
            
            // Handle Move-specific time inputs
            const startTimeInput = document.getElementById('propStartTime');
            if (startTimeInput) {
                startTimeInput.addEventListener('change', (e) => {
                    step.startTime = parseFloat(e.target.value);
                    if (step.endTime <= step.startTime) {
                        step.endTime = step.startTime + 0.1;
                    }
                    step.timestamp = (step.startTime + step.endTime) / 2; // Update midpoint
                    updateJSONOutput();
                    renderTimeline();
                });
            }
            
            const endTimeInput = document.getElementById('propEndTime');
            if (endTimeInput) {
                endTimeInput.addEventListener('change', (e) => {
                    step.endTime = parseFloat(e.target.value);
                    if (step.endTime <= step.startTime) {
                        step.startTime = step.endTime - 0.1;
                    }
                    step.timestamp = (step.startTime + step.endTime) / 2; // Update midpoint
                    updateJSONOutput();
                    renderTimeline();
                });
            }
        }

        function updateJSONOutput() {
            console.log('════════════════════════════════════════════════');
            console.log('🔄 updateJSONOutput() CALLED');
            logDebugMessage('updateJSONOutput()', 'Function called');

            if (!taskData) {
                console.log('❌ taskData is NULL or UNDEFINED');
                logDebugMessage('updateJSONOutput() ABORT', 'taskData is null!', true);
                return;
            }

            console.log('✅ taskData exists:');
            console.log(JSON.stringify(taskData, null, 2));

            const content = document.getElementById('jsonContent');
            if (!content) {
                console.log('❌ jsonContent element NOT FOUND in DOM');
                logDebugMessage('updateJSONOutput() ERROR', 'jsonContent element not found!', true);
                return;
            }

            console.log('✅ jsonContent element found in DOM');

            try {
                // Render as collapsible action blocks
                const blocksHTML = renderActionBlocks(taskData);
                content.innerHTML = blocksHTML;

                // Add click handlers for collapsible blocks
                const headers = content.querySelectorAll('.action-header');
                headers.forEach(header => {
                    header.addEventListener('click', function() {
                        const block = this.parentElement;
                        const details = this.nextElementSibling;
                        if (details && details.classList.contains('action-details')) {
                            details.classList.toggle('expanded');
                            block.classList.toggle('expanded');
                        }
                    });
                });

                logDebugMessage('updateJSONOutput() SUCCESS', `Rendered ${taskData.steps ? taskData.steps.length : 0} action blocks`);
            } catch (error) {
                logDebugMessage('updateJSONOutput() ERROR', `${error.message}: ${error.stack}`, true);
            }
        }

        function renderActionBlocks(taskData) {
            if (!taskData) {
                return '<div style="color: #858585; padding: 8px;">No task data</div>';
            }

            if (!taskData.steps || taskData.steps.length === 0) {
                return '<div style="color: #858585; padding: 8px;">No steps to display</div>';
            }

            let html = '';
            // Steps are already in order, just render them top to bottom
            taskData.steps.forEach((step, index) => {
                const action = step.action || 'Unknown';
                const borderColor = getActionColor(action);
                const timestamp = step.timestamp !== undefined ? step.timestamp.toFixed(2) + 's' : 'N/A';
                const stepNum = step.stepNumber !== undefined ? step.stepNumber : (index + 1);

                html += `<div class="json-action-block" style="border-left-color: ${borderColor};" data-step="${index}">`;
                html += `<div class="action-header">`;
                html += `<div class="action-title">`;
                html += `<span class="action-expand-icon">▶</span>`;
                html += `<span style="color: #858585; margin-right: 4px; font-size: 9px;">${stepNum}.</span>`;
                html += `<span>${action}</span>`;
                if (step.objectName) {
                    html += `<span style="color: #858585; margin-left: 4px; font-size: 9px;">- ${escapeHtml(step.objectName)}</span>`;
                }
                html += `</div>`;
                html += `<span style="font-size: 8px; color: #858585;">${timestamp}</span>`;
                html += `</div>`;
                html += `<div class="action-details">`;

                // Show key properties
                if (step.position) {
                    const pos = step.position;
                    html += `<div class="action-detail-row"><span class="action-detail-label">Position:</span>(${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})</div>`;
                }
                if (step.rotation) {
                    const rot = step.rotation;
                    html += `<div class="action-detail-row"><span class="action-detail-label">Rotation:</span>(${rot.x.toFixed(2)}, ${rot.y.toFixed(2)}, ${rot.z.toFixed(2)}, ${rot.w.toFixed(2)})</div>`;
                }
                if (step.action === 'Move') {
                    if (step.startTime !== undefined) {
                        html += `<div class="action-detail-row"><span class="action-detail-label">Start:</span>${step.startTime.toFixed(2)}s</div>`;
                    }
                    if (step.endTime !== undefined) {
                        html += `<div class="action-detail-row"><span class="action-detail-label">End:</span>${step.endTime.toFixed(2)}s</div>`;
                    }
                    if (step.duration !== undefined) {
                        html += `<div class="action-detail-row"><span class="action-detail-label">Duration:</span>${step.duration.toFixed(2)}s</div>`;
                    }
                }

                html += `</div>`;
                html += `</div>`;
            });

            return html;
        }

        function getActionColor(action) {
            const colors = {
                'PickUp': '#4ec9b0',
                'PutDown': '#ce9178',
                'Move': '#569cd6'
            };
            return colors[action] || '#858585';
        }

        function renderJSONNode(obj, depth) {
            if (obj === null || obj === undefined) {
                return '<span class="json-boolean">null</span>';
            }

            if (typeof obj === 'string') {
                return `<span class="json-string">"${escapeHtml(obj)}"</span>`;
            }

            if (typeof obj === 'number') {
                return `<span class="json-number">${obj}</span>`;
            }

            if (typeof obj === 'boolean') {
                return `<span class="json-boolean">${obj}</span>`;
            }

            if (Array.isArray(obj)) {
                if (obj.length === 0) return '[]';
                let html = '<span class="json-toggle"></span>[\n';
                html += '<div class="json-children">';
                obj.forEach((item, i) => {
                    html += '<div class="json-node">';
                    html += renderJSONNode(item, depth + 1);
                    if (i < obj.length - 1) html += ',';
                    html += '</div>\n';
                });
                html += '</div>]';
                return html;
            }

            if (typeof obj === 'object') {
                const keys = Object.keys(obj);
                if (keys.length === 0) return '{}';
                let html = '<span class="json-toggle"></span>{\n';
                html += '<div class="json-children">';
                keys.forEach((key, i) => {
                    html += '<div class="json-node">';
                    html += `<span class="json-key">"${key}"</span>: `;
                    html += renderJSONNode(obj[key], depth + 1);
                    if (i < keys.length - 1) html += ',';
                    html += '</div>\n';
                });
                html += '</div>}';
                return html;
            }

            return String(obj);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function togglePlay() {
            if (isPlaying) {
                pausePlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            document.getElementById('playPauseBtn').textContent = '⏸ Pause';
            document.getElementById('playPauseBtn').classList.add('active');

            playInterval = setInterval(() => {
                currentTime += 0.1;
                if (currentTime >= taskData.totalDuration) {
                    stopPlayback();
                } else {
                    updatePlayhead();
                    document.getElementById('currentTime').textContent = currentTime.toFixed(2);
                }
            }, 100);
        }

        function pausePlayback() {
            isPlaying = false;
            document.getElementById('playPauseBtn').textContent = '▶ Play';
            document.getElementById('playPauseBtn').classList.remove('active');
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
        }

        function stopPlayback() {
            pausePlayback();
            currentTime = 0;
            updatePlayhead();
            document.getElementById('currentTime').textContent = '0.00';
        }

        function updatePlayhead() {
            if (!taskData || taskData.totalDuration <= 0) return;

            const playhead = document.getElementById('playhead');
            const labelWidth = 100;

            // SIMPLIFIED: Direct time-to-pixels conversion
            // position = labelWidth + (currentTime × pixelsPerSecond)
            const pixelPosition = currentTime * pixelsPerSecond;
            const leftPosition = labelWidth + pixelPosition;

            playhead.style.left = leftPosition + 'px';

            // Update debug info
            const debugInfo = document.getElementById('debugInfo');
            if (debugInfo && currentTime > 0) {
                // Find closest event
                let closestEvent = null;
                let minDiff = Infinity;
                if (taskData && taskData.steps) {
                    taskData.steps.forEach(step => {
                        if (step.action === 'PickUp' || step.action === 'PutDown') {
                            // Simple time difference
                            const timeDiff = Math.abs(step.timestamp - currentTime);

                            if (timeDiff < minDiff) {
                                minDiff = timeDiff;
                                closestEvent = step;
                            }
                        }
                    });
                }

                if (closestEvent && minDiff < 1.0) {
                    debugInfo.textContent = `Time: ${currentTime.toFixed(2)}s | Nearest: ${closestEvent.action} @ ${closestEvent.timestamp.toFixed(2)}s | Diff: ${minDiff.toFixed(2)}s`;
                } else {
                    debugInfo.textContent = `Time: ${currentTime.toFixed(2)}s | Zoom: ${pixelsPerSecond}px/s`;
                }
            }
        }

        function adjustZoom(factor) {
            pixelsPerSecond *= factor;
            pixelsPerSecond = Math.max(10, Math.min(200, pixelsPerSecond));
            renderTimeline();
        }

        function exportJSON() {
            if (!taskData) {
                alert('No task data to export');
                return;
            }

            const json = JSON.stringify(taskData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `task_${taskData.taskName.replace(/\s+/g, '_')}_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // generateMoveActions function removed - Move blocks are now only created manually by user

        function copyJSON() {
            if (!taskData) return;
            const json = JSON.stringify(taskData, null, 2);
            navigator.clipboard.writeText(json).then(() => {
                const btn = document.getElementById('copyJsonBtn');
                const original = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = original;
                }, 2000);
            });
        }

        function deleteAction(step) {
            // Remove from task data - use multiple matching strategies
            let index = -1;
            
            // Strategy 1: Exact match by stepNumber, action, and objectId
            index = taskData.steps.findIndex(s => 
                s.stepNumber === step.stepNumber && 
                s.action === step.action && 
                s.objectId === step.objectId
            );
            
            // Strategy 2: For Move blocks, match by startTime/endTime and objectId
            if (index === -1 && step.action === 'Move') {
                const stepStart = step.startTime || step.timestamp;
                const stepEnd = step.endTime || (step.timestamp + 1.0);
                index = taskData.steps.findIndex(s => {
                    if (s.action !== 'Move' || s.objectId !== step.objectId) return false;
                    const sStart = s.startTime || s.timestamp;
                    const sEnd = s.endTime || (s.timestamp + 1.0);
                    return Math.abs(stepStart - sStart) < 0.05 && Math.abs(stepEnd - sEnd) < 0.05;
                });
            }
            
            // Strategy 3: Match by action, objectId, and timestamp (for point events)
            if (index === -1 && step.action !== 'Move') {
                index = taskData.steps.findIndex(s => 
                    s.action === step.action && 
                    s.objectId === step.objectId &&
                    Math.abs(s.timestamp - step.timestamp) < 0.05
                );
            }
            
            // Strategy 4: Last resort - match by objectId and action only (delete first match)
            if (index === -1) {
                index = taskData.steps.findIndex(s => 
                    s.action === step.action && 
                    s.objectId === step.objectId
                );
            }
            
            if (index !== -1) {
                taskData.steps.splice(index, 1);
            } else {
                console.error('Failed to delete step - no match found:', step);
                console.log('Available steps:', taskData.steps);
            }

            // Renumber remaining steps
            taskData.steps.sort((a, b) => {
                // Sort by timestamp, but for Move use startTime
                const timeA = a.action === 'Move' ? (a.startTime || a.timestamp) : a.timestamp;
                const timeB = b.action === 'Move' ? (b.startTime || b.timestamp) : b.timestamp;
                return timeA - timeB;
            });
            taskData.steps.forEach((s, idx) => {
                s.stepNumber = idx + 1;
            });

            // Deselect and refresh
            selectedStep = null;
            renderTimeline();
            renderProperties();
            updateJSONOutput();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Delete key to remove selected action
            if ((e.key === 'Delete' || e.key === 'Backspace') && selectedStep) {
                e.preventDefault();
                deleteAction(selectedStep);
            }
        });

        // Click outside to deselect
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.action-block') && 
                !e.target.closest('.properties-panel') &&
                !e.target.closest('.action-type-selector')) {
                selectedStep = null;
                renderProperties();
                document.querySelectorAll('.action-block').forEach(block => {
                    block.classList.remove('selected');
                });
            }
        });
    </script>
</body>
